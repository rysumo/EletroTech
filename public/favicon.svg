<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#3A506B" stroke-width="1.5" />

  <!-- Fish Silhouette / Water Wave (Bottom) -->
  <path d="M12 44 C22 36, 42 50, 52 42 C46 50, 24 52, 12 44 Z" fill="url(#electricGrad)" opacity="0.4" />
  <path d="M16 48 C28 42, 44 49, 50 44" fill="none" stroke="url(#electricGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

  <!-- Lightning Bolt (Electric/Automation) -->
  <polygon points="35,10 19,32 32,32 27,52 47,26 33,26" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
